[package]
name = "runen-input"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license.workspace = true
repository = "https://github.com/dornglut/runen-input"
description = "Backend-neutral device-input observation and confirmed-state framework"
publish = false

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
